name: Publish release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  macos:
    uses: ./.github/workflows/macos.yml
  linux:
    uses: ./.github/workflows/linux-tests.yml
  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FugScope-Windows-x64
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: FugScopeArm-macOS
          path: artifacts/macos
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/releases/$RELEASE_TAG.md"
          mkdir release-assets
          cp artifacts/windows/FugScope-windows-x64.zip release-assets/
          cp artifacts/macos/FugScopeArm-universal.zip release-assets/
          git archive --format=zip --prefix=FugScope/ -o release-assets/FugScope-source.zip HEAD
          for archive in release-assets/*.zip; do unzip -tq "$archive"; done
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            jq -e '.isDraft == true' release-state.json
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "FugScope $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
